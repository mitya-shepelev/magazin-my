name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE_PREFIX: ghcr.io/mitya-shepelev/magazin-my

jobs:
  nextjs:
    name: Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: magazin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magazin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/magazin_ci
      NEXTAUTH_SECRET: test
      NEXTAUTH_URL: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      WS_JWT_SECRET: test
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Digital Store CI
      YOOKASSA_SHOP_ID: ci-shop-id
      YOOKASSA_SECRET_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Critical smoke test
        run: npm run smoke:critical

      - name: Auth and checkout smoke test
        run: npm run smoke:auth-checkout

      - name: Admin API smoke test
        run: npm run smoke:admin-api

      - name: Chat API smoke test
        run: npm run smoke:chat-api

      - name: API security smoke test
        run: npm run smoke:api-security

      - name: Build
        run: npm run build

  websocket:
    name: WebSocket server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      WS_JWT_SECRET: websocket-ci-secret-at-least-32-chars
      CORS_ORIGIN: http://localhost:3000

    defaults:
      run:
        working-directory: ws-server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ws-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: WebSocket smoke test
        run: npm run smoke

  docker-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - nextjs
      - websocket
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_PREFIX }}-app
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=magazin-my app
            org.opencontainers.image.description=Next.js production app for magazin-my

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Migrator image metadata
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_PREFIX }}-migrate
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=magazin-my migrate
            org.opencontainers.image.description=Prisma migration runner for magazin-my

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: WebSocket image metadata
        id: meta-ws
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_PREFIX }}-ws
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=magazin-my websocket
            org.opencontainers.image.description=Socket.io realtime server for magazin-my

      - name: Build and push WebSocket image
        uses: docker/build-push-action@v6
        with:
          context: ./ws-server
          file: ./ws-server/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta-ws.outputs.tags }}
          labels: ${{ steps.meta-ws.outputs.labels }}
          cache-from: type=gha,scope=ws
          cache-to: type=gha,mode=max,scope=ws
