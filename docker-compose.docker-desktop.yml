services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: magazin-docker-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      # Local Docker Desktop smoke uses mock payments while keeping the production image.
      # The app validation treats CI=true as non-production-strict.
      CI: "true"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WS_JWT_SECRET: ${WS_JWT_SECRET}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Digital Store Docker}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-RUB}
      ROLLYPAY_API_URL: ${ROLLYPAY_API_URL:-https://rollypay.io}
      ROLLYPAY_API_KEY: ${ROLLYPAY_API_KEY:-}
      ROLLYPAY_WEBHOOK_SECRET: ${ROLLYPAY_WEBHOOK_SECRET:-}
      UPLOAD_DIR: /app/public/uploads
      DOWNLOAD_DIR: /app/private/downloads
      MESSAGE_UPLOAD_DIR: /app/uploads/messages
    volumes:
      - docker-uploads:/app/public/uploads
      - docker-downloads:/app/private/downloads
      - docker-message-uploads:/app/uploads/messages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      admin-bootstrap:
        condition: service_completed_successfully
    networks:
      - magazin-docker

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: magazin-docker-migrate:latest
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magazin-docker

  admin-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: magazin-docker-migrate:latest
    restart: "no"
    command: node scripts/bootstrap-admin.mjs
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_BOOTSTRAP_UPDATE_PASSWORD: ${ADMIN_BOOTSTRAP_UPDATE_PASSWORD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - magazin-docker

  ws:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    image: magazin-docker-ws:latest
    restart: unless-stopped
    ports:
      - "${WS_PORT:-3101}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WS_JWT_SECRET: ${WS_JWT_SECRET}
      CORS_ORIGIN: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - magazin-docker

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - docker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magazin-docker

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-56379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - docker-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magazin-docker

networks:
  magazin-docker:
    driver: bridge

volumes:
  docker-postgres-data:
  docker-redis-data:
  docker-uploads:
  docker-downloads:
  docker-message-uploads:
