services:
  app:
    image: ${APP_IMAGE:-ghcr.io/mitya-shepelev/magazin-my-app:main}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WS_JWT_SECRET: ${WS_JWT_SECRET}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Digital Store}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-rollypay}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-RUB}
      ROLLYPAY_API_URL: ${ROLLYPAY_API_URL:-https://rollypay.io}
      ROLLYPAY_API_KEY: ${ROLLYPAY_API_KEY}
      ROLLYPAY_WEBHOOK_SECRET: ${ROLLYPAY_WEBHOOK_SECRET}
      UPLOAD_DIR: /app/public/uploads
      DOWNLOAD_DIR: /app/private/downloads
      MESSAGE_UPLOAD_DIR: /app/uploads/messages
    volumes:
      - uploads:/app/public/uploads
      - downloads:/app/private/downloads
      - message-uploads:/app/uploads/messages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      admin-bootstrap:
        condition: service_completed_successfully
    networks:
      - magazin

  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/mitya-shepelev/magazin-my-migrate:main}
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magazin

  admin-bootstrap:
    image: ${MIGRATE_IMAGE:-ghcr.io/mitya-shepelev/magazin-my-migrate:main}
    restart: "no"
    command: node scripts/bootstrap-admin.mjs
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_BOOTSTRAP_UPDATE_PASSWORD: ${ADMIN_BOOTSTRAP_UPDATE_PASSWORD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - magazin

  ws:
    image: ${WS_IMAGE:-ghcr.io/mitya-shepelev/magazin-my-ws:main}
    restart: unless-stopped
    ports:
      - "${WS_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WS_JWT_SECRET: ${WS_JWT_SECRET}
      CORS_ORIGIN: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - magazin

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magazin

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magazin

  postgres-backup:
    image: postgres:16-alpine
    restart: "no"
    profiles:
      - ops
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    command: >
      sh -c 'mkdir -p /backups/postgres &&
      pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc
      -f "/backups/postgres/$${POSTGRES_DB}_$$(date +%Y%m%d_%H%M%S).dump"'
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magazin

  storage-backup:
    image: alpine:3.20
    restart: "no"
    profiles:
      - ops
    command: >
      sh -c 'mkdir -p /backups/storage &&
      tar -czf "/backups/storage/storage_$$(date +%Y%m%d_%H%M%S).tar.gz"
      -C /data uploads downloads message-uploads'
    volumes:
      - uploads:/data/uploads:ro
      - downloads:/data/downloads:ro
      - message-uploads:/data/message-uploads:ro
      - backups:/backups

networks:
  magazin:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads:
  downloads:
  message-uploads:
  backups:
